# SPDX-License-Identifier: GPL-3.0-or-later
name: Toma
options:
  bundleIdPrefix: dev.toma
  deploymentTarget:
    macOS: "15.0"
packages:
  RecorderKit:
    path: Packages/RecorderKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Toma:
    type: application
    platform: macOS
    sources:
      - App
      # GPLv3 §4 and §6: the app carries its license (Contents/Resources/LICENSE).
      - path: LICENSE
        buildPhase: resources
    configFiles:
      Debug: Config/Identity.xcconfig
      Release: Config/Identity.xcconfig
    settings:
      base:
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: App/Toma.entitlements
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        # The brand's violet (App/Resources/Assets.xcassets), unless the user picked an accent color in System Settings.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app's icon, App/AppIcon.icon (drawn by scripts/make-app-icon.swift): the layered glass icon on macOS 26,
        # and AppIcon.icns, which actool makes from it, on older systems.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        # Xcode adds com.apple.security.get-task-allow (debugging) unless told not to: never in a release.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    postBuildScripts:
      - name: Put the product name in InfoPlist.strings
        script: bash "$SRCROOT/scripts/expand-infoplist-strings.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/scripts/expand-infoplist-strings.sh
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/es.lproj/InfoPlist.strings
      # The toma command line (fases 4 y 5 design §6.2): the package's product, built for this target without being
      # linked into it, copied to Contents/Helpers/toma and signed before Xcode signs the app.
      - name: Put toma in Contents/Helpers
        script: bash "$SRCROOT/scripts/embed-toma.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/scripts/embed-toma.sh
          - $(BUILT_PRODUCTS_DIR)/toma
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/toma
    dependencies:
      - package: RecorderKit
        product: RecorderKit
      - package: RecorderKit
        product: AppSupport
      # The project API, for the app's control socket (milestone 4b).
      - package: RecorderKit
        product: ProjectAPI
      # Built, never linked: scripts/embed-toma.sh puts it in Contents/Helpers.
      - package: RecorderKit
        product: toma
        link: false
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: $(PRODUCT_NAME) records your microphone only when you enable it for a recording.
        NSCameraUsageDescription: $(PRODUCT_NAME) shows and records your camera only when you turn it on for a recording.
        NSAudioCaptureUsageDescription: $(PRODUCT_NAME) records audio from the apps you choose only when you turn on system audio for a recording.
        # An iPhone nearby can be the camera (Continuity Camera), and is listed with the others.
        NSCameraUseContinuityCameraDeviceType: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        NSHumanReadableCopyright: "Copyright © 2026 the $(PRODUCT_NAME) contributors. Free software under the GNU GPL, version 3 or later, without any warranty."
        # Where the source code is; Acknowledgements shows it at the tag of this version.
        SourceCodeURL: $(SOURCE_CODE_URL)
        CFBundleDocumentTypes:
          - CFBundleTypeName: "$(PRODUCT_NAME) Project"
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - "$(PROJECT_TYPE_IDENTIFIER)"
          # A named style (1c design §8): opening one imports it into the app's styles.
          - CFBundleTypeName: "$(PRODUCT_NAME) Style"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - "$(STYLE_TYPE_IDENTIFIER)"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: "$(PROJECT_TYPE_IDENTIFIER)"
            UTTypeDescription: "$(PRODUCT_NAME) Project"
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - "$(PROJECT_FILE_EXTENSION)"
          - UTTypeIdentifier: "$(STYLE_TYPE_IDENTIFIER)"
            UTTypeDescription: "$(PRODUCT_NAME) Style"
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - "$(STYLE_FILE_EXTENSION)"
