# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release at a time, never cancelled halfway: two runs would publish over each other's appcast.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    # Holds the signing certificate and Sparkle's private key; the owner approves each run.
    environment: release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # the build number counts every commit
          persist-credentials: false # no token in .git/config for the steps below
      - name: Release only commits that are on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: tag a commit of main"; exit 1; }
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install XcodeGen (pinned, checksum checked)
        run: |
          bash scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Resolve the pinned packages and check their licenses
        run: |
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Toma.xcodeproj -scheme Toma -derivedDataPath build \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -packageAuthorizationProvider netrc
          bash scripts/check-licenses.sh

      - name: Check the release secrets
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          for name in SIGNING_CERT_P12 SIGNING_CERT_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set in the release environment (docs/release.md)"
              exit 1
            fi
          done

      - name: Import the signing certificate into a temporary keychain
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # The decoded certificate never outlives this step, whatever fails.
          trap 'rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-cert.pem"' EXIT
          keychain="$RUNNER_TEMP/toma-signing.keychain-db"
          # LibreSSL reads the .p12 that scripts/create-signing-cert.sh wrote; OpenSSL 3 may not.
          keychain_password=$(/usr/bin/openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          # security import takes the password only as an argument or in a dialog: on this single-use runner
          # it is visible to other processes (ps) while the import runs, never in the log (it is a secret).
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trusted for code signing on this runner only. If macOS refuses, release.sh says so
          # and the release is signed on the owner's Mac instead (docs/release.md).
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys -passin env:SIGNING_CERT_PASSWORD \
            -out "$RUNNER_TEMP/signing-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/signing-cert.pem" ||
            echo "::warning::Could not trust the signing certificate on this runner"
          security find-identity -p codesigning "$keychain"

      - name: Bring the previous release's appcast and DMGs
        # The new appcast keeps the earlier versions, with delta updates from them. generate_appcast points every
        # DMG in dist/ at this release's URL, so they are all published again with it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then
            gh release download "$previous" --dir dist --pattern appcast.xml --pattern '*.dmg'
          fi
          ls -l dist

      - name: Build, sign and package
        env:
          # release.sh takes it out of the environment before running anything: only generate_appcast sees it.
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
          # GPLv3 §6: the app says where the source code of this version is.
          SOURCE_CODE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Lock the temporary keychain
        # Nothing after the build signs: the certificate's key is out of reach of the steps below.
        if: always()
        run: security lock-keychain "$RUNNER_TEMP/toma-signing.keychain-db" || true

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          [ -f "dist/Toma-$version.dmg" ] || { echo "::error::dist/Toma-$version.dmg is missing"; exit 1; }
          # Every file the appcast points to: this version's DMG, the earlier ones it still lists, and the deltas.
          files=(dist/*.dmg dist/*.delta dist/appcast.xml)
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag --title "Toma $version" \
            --notes "Versión de prueba de la fase 0. Cómo instalarla y abrirla la primera vez: https://github.com/$GITHUB_REPOSITORY#instalar" \
            "${files[@]}"

      - name: Delete the temporary keychain and certificate files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-cert.pem"
          security delete-keychain "$RUNNER_TEMP/toma-signing.keychain-db" || true
