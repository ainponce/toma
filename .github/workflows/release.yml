name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # Holds the signing certificate and Sparkle's private key; the owner approves each run.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts every commit
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: brew install xcodegen

      - name: Check the release secrets
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          for name in SIGNING_CERT_P12 SIGNING_CERT_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set in the release environment (docs/release.md)"
              exit 1
            fi
          done

      - name: Import the signing certificate into a temporary keychain
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/toma-signing.keychain-db"
          # LibreSSL reads the .p12 that scripts/create-signing-cert.sh wrote; OpenSSL 3 may not.
          keychain_password=$(/usr/bin/openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trusted for code signing on this runner only. If macOS refuses, release.sh says so
          # and the release is signed on the owner's Mac instead (docs/release.md).
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys -passin env:SIGNING_CERT_PASSWORD \
            -out "$RUNNER_TEMP/signing-cert.pem"
          rm -f "$RUNNER_TEMP/signing.p12"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/signing-cert.pem" ||
            echo "::warning::Could not trust the signing certificate on this runner"
          security find-identity -p codesigning "$keychain"

      - name: Build, sign and package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: bash scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag --title "Toma $version" \
            --notes "Versión de prueba de la fase 0. Cómo instalarla y abrirla la primera vez: https://github.com/$GITHUB_REPOSITORY#instalar" \
            "dist/Toma-$version.dmg" dist/appcast.xml

      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/toma-signing.keychain-db" || true
