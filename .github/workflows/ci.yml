name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: swift --version
      - run: brew install xcodegen
      - run: make test
      - run: make crash-test
      - run: make project
      - name: Build app
        run: xcodebuild -project Toma.xcodeproj -scheme Toma -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
